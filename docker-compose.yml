services:
  jnotes:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Bind mount (not a named volume): the whole point of markdown-file storage is
      # host-visible, copyable, backupable notes. Swap for a named volume (e.g.
      # `jnotes-data:/data`) if you don't need host-side access to the files.
      - ./data:/data
    environment:
      - NOTES_PATH=/data/notes
      # Signs the auth cookie. On the bind mount on purpose: on the container filesystem these are
      # regenerated on every restart, silently signing everyone out.
      - DATA_PROTECTION_KEYS_PATH=/data/keys
      # Split into host/port/db/user/password (rather than one connection string) so the same
      # POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD values below can be shared with the `postgres`
      # service's own environment instead of hand-building/duplicating a connection string.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-jnotes}
      - POSTGRES_USER=${POSTGRES_USER:-jnotes}
      # CHANGE THIS for anything reachable beyond your machine: export POSTGRES_PASSWORD=... or put
      # it in a .env file (gitignored). It's shared with the `postgres` service below.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jnotes}
      # Override by exporting TZ before running compose, or adding TZ=... to a .env file.
      - TZ=${TZ:-UTC}
      # Set to 0 to disable background index reconciliation.
      - AUTO_INDEX_INTERVAL_MINUTES=${AUTO_INDEX_INTERVAL_MINUTES:-5}
      # Optional OIDC login — uncomment and set via a .env file (or export before running compose)
      # to enable. All three must be set, or OIDC stays disabled. See README.md's Authentication section.
      # - OIDC_AUTHORITY=${OIDC_AUTHORITY}
      # - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - OIDC_DISPLAY_NAME=${OIDC_DISPLAY_NAME:-OIDC}
      # Optional PDF export (an "Export PDF" button on each note). Off unless GOTENBERG_URL is set. To turn
      # it on, add BOTH lines to a .env file:  COMPOSE_PROFILES=pdf  (starts the gotenberg service below)
      # and  GOTENBERG_URL=http://gotenberg:3000  (tells the app where it is). See README.md's "PDF export".
      - GOTENBERG_URL=${GOTENBERG_URL:-}
      # Optional background AI auto-tagging with Ollama. Runs only when OLLAMA_URL is set: untagged notes are
      # tagged every AUTO_TAG_INTERVAL_MINUTES, up to AUTO_TAG_BATCH_SIZE per pass. Ollama on the host:
      # OLLAMA_URL=http://host.docker.internal:11434. Bundled service: COMPOSE_PROFILES=ollama and
      # OLLAMA_URL=http://ollama:11434. See README.md's "Auto-tagging".
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-phi4}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120}
      - AUTO_TAG_INTERVAL_MINUTES=${AUTO_TAG_INTERVAL_MINUTES:-10}
      - AUTO_TAG_BATCH_SIZE=${AUTO_TAG_BATCH_SIZE:-10}
    extra_hosts:
      # Lets the container reach an Ollama running on the host as host.docker.internal. Linux needs this
      # line; Docker Desktop (Windows/Mac) already provides the name, so it's harmless there.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        # Not just "started": the app migrates the schema before serving traffic, so it needs a
        # database that's finished initdb. (It also retries for ~20s on its own — see
        # HostExtensions.MigrateJNotesDatabaseAsync — but waiting properly is cleaner.)
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      # Same values as the jnotes service above — kept as separate lines (not YAML anchors) so each
      # service's env block stays readable on its own.
      - POSTGRES_DB=${POSTGRES_DB:-jnotes}
      - POSTGRES_USER=${POSTGRES_USER:-jnotes}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jnotes}
    volumes:
      # Unlike the Redis service this replaces, the volume is NOT optional. Redis held only the note
      # index — a derived cache the startup reconciliation pass rebuilds from ./data/notes, so an
      # empty Redis was a one-time rescan and never data loss. PostgreSQL now also holds the user
      # accounts and settings, which exist nowhere else: lose this volume and you re-run /setup and
      # re-create every user. (The NoteIndex* tables in the same database are still throwaway.)
      #
      # Mounted at /var/lib/postgresql, NOT /var/lib/postgresql/data. The postgres:18+ images moved
      # PGDATA into a version-specific subdirectory (/var/lib/postgresql/18/docker) and declare the
      # VOLUME one level up. A /var/lib/postgresql/data mount is silently ignored on 18 — the data
      # goes to an anonymous volume and initdb re-runs on every recreate, with no error at all.
      #
      # A named volume rather than a bind mount: a Postgres data directory isn't human-readable
      # (unlike the notes, which is exactly why those are bind-mounted) and bind-mounted PGDATA has
      # well-known ownership problems on macOS/Windows. Back it up with pg_dump, not `cp`.
      - jnotes-pgdata:/var/lib/postgresql
    healthcheck:
      # $POSTGRES_USER/$POSTGRES_DB are shell-expanded inside the container, from the environment
      # block above — not compose variable substitution — so this still works if you override them.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gotenberg:
    # Chromium-based HTML -> PDF converter, used only by the optional PDF export. Behind the "pdf"
    # profile so a plain `docker compose up` never starts it. No `ports:` on purpose: only the jnotes
    # service (same compose network) talks to it, and Gotenberg has no authentication of its own.
    image: gotenberg/gotenberg:8
    profiles: ["pdf"]
    command:
      - gotenberg
      # JNotes sends everything the page needs (HTML, images, fonts, mermaid) inside the request, so
      # Chromium never needs the network: only the request's own temp files may load. Stops a note
      # (e.g. an <img> in a mermaid label) from making Gotenberg fetch URLs on your internal network.
      - "--chromium-allow-list=^file:///tmp/.*"
    healthcheck:
      # curl ships in the image for exactly this.
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ollama:
    # Optional bundled Ollama, used only by background auto-tagging. Behind the "ollama" profile so a plain
    # `docker compose up` never starts it, and jnotes has no depends_on on it (that would break a plain
    # `up` with the profile off). No `ports:` on purpose: only the jnotes service talks to it, and Ollama
    # has no authentication of its own. Pull the model once:  docker compose exec ollama ollama pull phi4
    # GPU passthrough is host-specific and not configured here; see https://docs.ollama.com/docker
    image: ollama/ollama:0.34.4
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  jnotes-pgdata:
  ollama-models:
