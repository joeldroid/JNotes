# main / version tags: build and test, then build, smoke-check and push the image to Docker Hub.
# Needs repository variable DOCKERHUB_USERNAME and secret DOCKERHUB_TOKEN (a Docker Hub PAT, Read & Write).
# The same tags are also pushed to the GitHub Container Registry (ghcr.io), using the built-in GITHUB_TOKEN.
# Builds from main are also versioned {YY}{DAY-OF-YEAR}{RUN_OF_THE_DAY, 2 digits} (e.g. 2630501): that is the extra
# Docker tag and a git tag on the commit. Needs repository variable RUN_OF_THE_DAY (the next run number; the first
# build of a UTC day always uses 1, whatever it holds) and secret VARIABLES_TOKEN: a fine-grained PAT limited to this
# repo with "Variables: read and write" (GITHUB_TOKEN cannot read or write Actions variables).
name: Build, test and publish

on:
  push:
    branches: [main]
    # Pushes to main only build and publish when something under src/ changed. GitHub doesn't evaluate path
    # filters for tag pushes, so a v* tag still always publishes; workflow_dispatch below is the manual override.
    paths:
      - 'src/**'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: joeldroid/jnotes
  # Must be lowercase (a registry requirement, and the repository name is mixed case), so it is not derived.
  GHCR_IMAGE_NAME: ghcr.io/joeldroid/jnotes

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  docker:
    name: Build and push image
    needs: build-test
    # Only the real repo (forks have no Docker Hub credentials), and only main or v* tags
    # (a workflow_dispatch from another branch builds and tests but never pushes).
    if: >-
      github.repository == 'joeldroid/JNotes' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: write only to create the git tag through the API (checkout keeps no git credentials);
    # packages: write to push to ghcr.io.
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # {YY}{DAY-OF-YEAR}{RUN}: 26 + 305 + 01 = 2630501. The counter is only read here; it is advanced after the
      # push succeeds, so a failed build doesn't burn a number. Publish runs on one ref are serialized by the
      # concurrency group, so two main builds never read the same value. A new UTC day has no tag with today's
      # prefix yet, which is what resets the counter to 1.
      - name: Compute build version
        id: version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="$(date -u +%y%j)"
          if [ "$(gh api "repos/${REPO}/git/matching-refs/tags/${prefix}" --jq 'length')" = "0" ]; then
            run=1
          else
            run="$(gh api "repos/${REPO}/actions/variables/RUN_OF_THE_DAY" --jq .value)"
          fi
          if ! [[ "$run" =~ ^[0-9]+$ ]] || [ "$run" -lt 1 ]; then
            echo "::error::RUN_OF_THE_DAY must be a positive integer, got '${run}'"
            exit 1
          fi
          version="${prefix}$(printf '%02d' "$run")"
          if gh api "repos/${REPO}/git/ref/tags/${version}" >/dev/null 2>&1; then
            echo "::error::Tag ${version} already exists; set RUN_OF_THE_DAY to a higher number"
            exit 1
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${version}"

      # latest + the date-run version = main; semver tags from v1.2.3 -> 1.2.3, 1.2, 1 (no bare major for 0.x).
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version || 'unused' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build into the local daemon first so the image can be checked before anything is pushed.
      - name: Build image (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: jnotes:smoke
          cache-from: type=gha,scope=jnotes
          cache-to: type=gha,scope=jnotes,mode=max

      # Guards the CLAUDE.md "Docker build gotcha": a stale static-web-assets manifest ships an image
      # without _framework/blazor.web.js that still builds and starts fine.
      - name: Smoke test image (Blazor script present)
        run: docker run --rm --entrypoint sh jnotes:smoke -c 'ls -l /app/wwwroot/_framework/blazor.web*.js'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as above, so every layer is a cache hit; only the export/push is new work.
      # One push, every tag to both registries (Docker Hub and ghcr.io).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=jnotes

      # After the push, so the git tag and the counter only move for an image that really exists.
      - name: Tag commit with build version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh api -X POST "repos/${REPO}/git/refs"
          -f ref="refs/tags/${VERSION}" -f sha="${GITHUB_SHA}"

      - name: Increment RUN_OF_THE_DAY
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
          REPO: ${{ github.repository }}
          RUN: ${{ steps.version.outputs.run }}
        run: >-
          gh api -X PATCH "repos/${REPO}/actions/variables/RUN_OF_THE_DAY"
          -f value="$((RUN + 1))"
